<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Maged | Courses Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css" />
</head>
<body>
    <div id="adminApp"></div>
    <div id="toast" class="toast"></div>
    <footer class="site-footer">© 2026 Dr. Maged. All Rights Reserved.</footer>

    <script src="../api.js"></script>
    <script>
    const adminApp = document.getElementById('adminApp');

    if (!NorthstarAPI.requireAdmin()) {
    }

    const adminState = {
        selectedYear: 'First Year',
        view: 'list',
        editingCourse: null,
        courses: []
    };

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    let toastTimer = null;
    function adminToast(message) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function adminSidebar() {
        return `
        <aside class="admin-sidebar">
          <div class="mobile-sidebar-head">
            <span>Menu</span>
            <button data-action="close-sidebar">&times;</button>
          </div>
          <div class="brand">
            <span class="brand-mark">M</span> Dr. Maged
          </div>
          <nav>
            <button class="admin-nav-link active" data-action="navigate-courses">
              Courses Management
            </button>
            <button class="admin-nav-link" data-action="navigate-students">
              Student Accounts
            </button>
            <button class="admin-nav-link" data-action="navigate-grades">
              Grades
            </button>
          </nav>
          <div class="admin-sidebar-bottom">
            <div class="admin-profile">
              <div class="avatar">SA</div>
              <div>
                <b>System Admin</b>
                <span>Administrator</span>
              </div>
            </div>
            <button class="admin-signout" data-action="logout">Sign Out</button>
          </div>
        </aside>
      `;
    }

    function adminCoursesListPage() {
        const years = ['First Year', 'Second Year', 'Third Year', 'Fourth Year'];
        const filteredCourses = adminState.courses.filter(c => c.year === adminState.selectedYear);

        return `
        <header class="admin-topbar">
          <div>
            <h1>Courses Management</h1>
            <p>Create and manage courses for all academic years</p>
          </div>
        </header>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <div>
              <h3>Select Year</h3>
              <p>Manage courses for a specific academic year</p>
            </div>
            <div class="year-selector">
              ${years.map(year => `
                <button
                    class="${adminState.selectedYear === year ? 'active' : ''}"
                    data-action="select-year"
                    data-year="${esc(year)}">
                    ${esc(year)}
                </button>
              `).join('')}
            </div>
          </div>

          <div style="display:flex;justify-content:flex-end;margin:20px 0;">
            <button class="secondary" data-action="add-course">+ Add New Course</button>
          </div>

          ${filteredCourses.length === 0 ? `
            <div class="empty-state-admin">
                <div class="empty-icon">📚</div>
                <h3>No Courses Yet</h3>
                <p>No courses available for ${esc(adminState.selectedYear)}.</p>
            </div>
          ` : `
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Course Title</th>
                        <th>Lectures</th>
                        <th>Cover</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                ${filteredCourses.map(course => `
                    <tr>
                        <td><strong>${esc(course.title)}</strong></td>
                        <td>${course.lectures ? course.lectures.length : 0}</td>
                        <td>${course.cover ? '✓ Yes' : '✗ No'}</td>
                        <td>
                            <div class="admin-actions">
                                <button class="btn-edit" data-action="manage-lectures" data-course-id="${esc(course.id)}">
                                    Manage Lectures
                                </button>
                                <button class="btn-edit" data-action="edit-course" data-course-id="${esc(course.id)}">
                                    Edit
                                </button>
                                <button class="btn-delete" data-action="delete-course" data-course-id="${esc(course.id)}">
                                    Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('')}
                </tbody>
            </table>
          `}
        </section>
      `;
    }

    function adminCourseForm() {
        const course = adminState.editingCourse;
        const isEditing = course !== null;

        return `
        <header class="admin-topbar">
          <div>
            <h1>${isEditing ? 'Edit Course' : 'Add New Course'}</h1>
            <p>${isEditing ? 'Update course details' : 'Create a new course for'} ${esc(adminState.selectedYear)}</p>
          </div>
        </header>
        <section class="admin-panel admin-form-section">
          <div class="field">
            <label>Course Title *</label>
            <input id="courseTitle" type="text" value="${isEditing ? esc(course.title) : ''}" placeholder="Enter course title">
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="courseDescription" placeholder="Enter course description">${isEditing ? esc(course.description || '') : ''}</textarea>
          </div>
          <div class="field">
            <label>Cover Image</label>
            <input id="courseCover" type="file" accept="image/*">
            ${isEditing && course.cover ? `
              <div style="margin-top: 8px;">
                <img src="${course.cover}" style="max-width: 100px; max-height: 100px; border-radius: 4px; border: 1px solid var(--line);">
                <button data-action="remove-cover" class="btn-delete" style="margin-left: 10px; padding: 2px 8px;">Remove</button>
              </div>
            ` : ''}
          </div>
          <div class="form-actions">
            <button class="outline" data-action="cancel-course-form">Cancel</button>
            <button class="primary" data-action="save-course">${isEditing ? 'Update Course' : 'Create Course'}</button>
          </div>
        </section>
      `;
    }

    const MAX_COVER_BYTES = 2 * 1024 * 1024;

    async function loadCourses() {
        try {
            adminState.courses = await NorthstarAPI.Admin.listCourses();
        } catch (err) {
            adminToast(err.message || 'Could not load courses.');
            adminState.courses = [];
        }
    }

    async function saveCourse() {
        const title = document.getElementById('courseTitle').value.trim();
        const description = document.getElementById('courseDescription').value.trim();
        const coverFile = document.getElementById('courseCover').files[0];

        if (!title) {
            adminToast('Please enter a course title.');
            return;
        }

        if (coverFile && coverFile.size > MAX_COVER_BYTES) {
            adminToast('Cover image is too large (max ~2MB).');
            return;
        }

        const course = adminState.editingCourse;
        const isEditing = course !== null;

        let coverData = isEditing ? course.cover : null;
        if (coverFile) {
            try {
                coverData = await NorthstarAPI.uploadFile(coverFile, 'covers');
            } catch (err) {
                console.error(err);
                adminToast(err.message || 'Could not upload the cover image.');
                return;
            }
        }

        try {
            if (!isEditing) {
                await NorthstarAPI.Admin.createCourse({
                    title,
                    description,
                    year: adminState.selectedYear,
                    cover: coverData
                });
                adminToast('Course created successfully!');
            } else {
                await NorthstarAPI.Admin.updateCourse(course.id, { title, description, cover: coverData });
                adminToast('Course updated successfully!');
            }
        } catch (err) {
            adminToast(err.message || 'Could not save the course.');
            return;
        }

        adminState.editingCourse = null;
        adminState.view = 'list';
        await loadCourses();
        renderContent();
    }

    async function removeCover() {
        const course = adminState.editingCourse;
        if (!course) return;
        try {
            await NorthstarAPI.Admin.updateCourse(course.id, { cover: null });
            course.cover = null;
            adminToast('Cover removed.');
        } catch (err) {
            adminToast(err.message || 'Could not remove the cover.');
        }
        renderContent();
    }

    async function deleteCourse(courseId) {
        if (!confirm('Are you sure you want to delete this course? This will also delete all lectures.')) return;
        try {
            await NorthstarAPI.Admin.deleteCourse(courseId);
            adminToast('Course deleted.');
        } catch (err) {
            adminToast(err.message || 'Could not delete the course.');
        }
        await loadCourses();
        renderContent();
    }

    function renderContent() {
        const content = document.getElementById('adminContent');
        if (!content) return;
        content.innerHTML = adminState.view === 'course-form' ? adminCourseForm() : adminCoursesListPage();
    }

    async function renderAdminPanel() {
        adminApp.innerHTML = `
        <div class="admin-shell">
          ${adminSidebar()}
          <main class="admin-main">
            <button class="mobile-menu-button" data-action="toggle-sidebar">☰ Menu</button>
            <div id="adminContent"><div class="loading-state">Loading courses…</div></div>
          </main>
        </div>
      `;
        await loadCourses();
        renderContent();
    }

    document.addEventListener('click', (e) => {
        const clickedEl = e.target;
        const target = clickedEl.closest('[data-action]');

        if (!target) {
            const openSidebar = document.querySelector('.admin-sidebar.open');
            if (openSidebar && !openSidebar.contains(clickedEl) && !clickedEl.closest('.mobile-menu-button')) {
                openSidebar.classList.remove('open');
            }
            return;
        }

        const action = target.dataset.action;

        switch (action) {
            case 'toggle-sidebar': document.querySelector('.admin-sidebar')?.classList.toggle('open'); break;
            case 'close-sidebar': document.querySelector('.admin-sidebar')?.classList.remove('open'); break;
            case 'navigate-courses': adminState.view = 'list'; adminState.editingCourse = null; renderContent(); break;
            case 'navigate-students': window.location.href = 'admin-students.html'; break;
            case 'navigate-grades': window.location.href = 'admin-grades.html'; break;
            case 'logout':
                NorthstarAPI.clearSession();
                window.location.href = '../login.html';
                break;
            case 'select-year': adminState.selectedYear = target.dataset.year; adminState.view = 'list'; renderContent(); break;
            case 'add-course': adminState.editingCourse = null; adminState.view = 'course-form'; renderContent(); break;
            case 'edit-course':
                adminState.editingCourse = adminState.courses.find(c => c.id === target.dataset.courseId) || null;
                adminState.view = 'course-form';
                renderContent();
                break;
            case 'manage-lectures':
                window.location.href = `admin-lectures.html?courseId=${encodeURIComponent(target.dataset.courseId)}`;
                break;
            case 'delete-course': deleteCourse(target.dataset.courseId); break;
            case 'save-course': saveCourse(); break;
            case 'cancel-course-form': adminState.editingCourse = null; adminState.view = 'list'; renderContent(); break;
            case 'remove-cover': removeCover(); break;
        }
    });

    if (NorthstarAPI.isLoggedIn() && NorthstarAPI.isAdmin()) renderAdminPanel();
    </script>
</body>
</html>
