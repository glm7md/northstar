<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دكتور ماجد | نتيجة الاختبار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>
    <footer class="site-footer">© 2026 دكتور ماجد. جميع الحقوق محفوظة.</footer>

    <script src="api.js"></script>
    <script>
    const app = document.getElementById('app');
    const attemptId = new URLSearchParams(window.location.search).get('attemptId');

    function render(attempt) {
        if (!attempt) {
            app.innerHTML = `
            <div class="quiz-shell">
              <div class="empty-state">
                <div class="empty-icon">📝</div>
                <h2>Result Not Found</h2>
                <button class="back-button" data-action="go-dashboard">← Back to My Courses</button>
              </div>
            </div>
          `;
            return;
        }

        app.innerHTML = `
        <div class="quiz-shell">
          <div class="quiz-result-card">
            <div class="quiz-score-circle">${attempt.mcqScore}/${attempt.mcqTotal}</div>
            <h2>Quiz Submitted</h2>
            <p>Your multiple choice score is <strong>${attempt.mcqScore} out of ${attempt.mcqTotal}</strong>.</p>
            <p>${attempt.essayTotal > 0 ? `This quiz includes ${attempt.essayTotal} essay question${attempt.essayTotal === 1 ? '' : 's'} that require instructor review.` : ''} Your final grade will appear in My Results once it has been reviewed and published by your instructor.</p>
            <div class="quiz-result-actions">
              <button class="outline" data-action="go-results">View My Results</button>
              <button class="primary" data-action="go-course">Back to Course</button>
            </div>
          </div>
        </div>
      `;
    }

    let currentAttempt = null;

    document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        switch (target.dataset.action) {
            case 'go-results': window.location.href = 'my-results.html'; break;
            case 'go-course':
                window.location.href = currentAttempt ? `course-details.html?courseId=${encodeURIComponent(currentAttempt.courseId)}` : 'dashboard.html';
                break;
            case 'go-dashboard': window.location.href = 'dashboard.html'; break;
        }
    });

    async function init() {
        if (!NorthstarAPI.requireStudent()) return;
        try {
            currentAttempt = await NorthstarAPI.Quiz.getAttempt(attemptId);
            render(currentAttempt);
        } catch (err) {
            render(null);
        }
    }

    init();
    </script>
</body>
</html>
